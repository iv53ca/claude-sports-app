name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Copy the web app into the Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r docs/. android/app/src/main/assets/www/
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cycle-ad-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cycle-ad.apk
          gh release create "build-${{ github.run_number }}" cycle-ad.apk \
            --title "Cycle A-D, build ${{ github.run_number }}" \
            --notes "APK for Android. Download cycle-ad.apk and open it on the phone." \
            --target "${{ github.sha }}"
