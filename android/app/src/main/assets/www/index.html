function fillForm(date){
  const r=S.measures[date]||null;
  METRICS.forEach(m=>{const i=$('#m-'+m.k);i.value=r&&typeof r[m.k]==='number'?String(r[m.k]).replace('.',','):'';});
  $('#m-hint').textContent=r?'За эту дату запись уже есть. Сохранение её обновит.':'Заполни то, что измерила. Пустые поля не сохраняются.';
}
async function submitMeasure(ev){
  ev.preventDefault();
  const err=$('#m-err'),date=$('#m-date').value,body={date:date};let n=0,bad=null;
  METRICS.forEach(m=>{const raw=$('#m-'+m.k).value.trim().replace(',','.');if(!raw)return;
    const v=Number(raw);if(!isFinite(v)||v<10||v>300){bad=m.label;return;}body[m.k]=Math.round(v*10)/10;n++;});
  if(!validISO(date)){err.textContent='Выбери дату.';err.hidden=false;return;}
  if(bad){err.textContent='Проверь поле «'+bad+'»: нужно число, например 75,5.';err.hidden=false;return;}
  if(!n){err.textContent='Заполни хотя бы одно поле.';err.hidden=false;return;}
  err.hidden=true;
  try{await saveDoc('measures',date,body);toast('Запись за '+fmtDay(date)+' сохранена');$('#m-hint').textContent='За эту дату запись уже есть. Сохранение её обновит.';}
  catch(e){fail(e);}
}

/* ---------- plan ---------- */
function renderPlan(){
  let h=PLAN.ref.map((s,i)=>'<details class="acc"'+(i===0?' open':'')+'><summary>'+esc(s.title)+'</summary><div class="prose">'+s.html+'</div></details>').join('');
  if(STANDALONE)h+='<div class="card"><div class="h2">Резервная копия</div><p class="sub">Записи лежат только на этом устройстве. Скопируй их в заметки или отправь себе, чтобы не потерять при смене телефона или удалении приложения.</p>'+
    '<div class="actions"><button type="button" class="btn" data-act="export">Скопировать записи</button><button type="button" class="btn" data-act="import">Восстановить из текста</button></div>'+
    '<div class="field"><label for="bk-text">Текст резервной копии</label><textarea id="bk-text" rows="4" spellcheck="false" autocomplete="off"></textarea></div><p class="sub" id="bk-msg" role="status"></p></div>';
  $('#tab-plan').innerHTML=h;
}
function exportData(){
  const t=JSON.stringify({app:'cycle-ad',v:1,log:S.log,measures:S.measures}),ta=$('#bk-text'),msg=$('#bk-msg');
  ta.value=t;ta.focus();ta.select();
  const ok=()=>{msg.textContent='Скопировано. Вставь текст в заметки или в сообщение себе.';};
  const manual=()=>{msg.textContent='Текст выделен в поле. Скопируй его вручную.';};
  try{navigator.clipboard.writeText(t).then(ok,manual);}catch(e){manual();}
}
function importData(){
  const msg=$('#bk-msg');let o=null;
  try{o=JSON.parse($('#bk-text').value);}catch(e){o=null;}
  if(!o||typeof o.log!=='object'||typeof o.measures!=='object'||!o.log||!o.measures){msg.textContent='Это не похоже на резервную копию. Вставь в поле текст, который дала кнопка «Скопировать записи».';return;}
  const log=Object.assign({},S.log),ms=Object.assign({},S.measures);let a=0,b=0;
  Object.keys(o.log).forEach(id=>{const e=o.log[id];if(e&&validISO(e.date)&&ORDER.indexOf(e.w)>=0){log[e.date+'_'+e.w]={date:e.date,w:e.w,ts:Number(e.ts)||0};a++;}});
  Object.keys(o.measures).forEach(id=>{const e=o.measures[id];if(!e||!validISO(e.date))return;const r={date:e.date};let n=0;
    METRICS.forEach(m=>{if(typeof e[m.k]==='number'&&isFinite(e[m.k])){r[m.k]=e[m.k];n++;}});if(n){ms[e.date]=r;b++;}});
  S.log=log;S.measures=ms;persistLocal();renderData();
  msg.textContent='Восстановлено: тренировок '+a+', записей мерок '+b+'.';
}

/* ---------- shell ---------- */
function renderSync(){
  const el=$('#sync');el.className='sync'+((S.mode==='db'&&!S.error)||(STANDALONE&&S.ready)?' ok':S.mode==='local'?' local':'');
  $('span',el).textContent=!S.ready?'Загрузка записей…':S.error?'Записи не загрузились':S.mode==='db'?'Записи сохраняются':STANDALONE?'Хранится на этом устройстве':'Только этот браузер';
}
function renderData(){renderSync();renderToday();renderTiles();if(S.tab==='measures')drawChart();renderTable();}
function showTab(t,push){
  S.tab=t;TABS.forEach(n=>{$('#tab-'+n).hidden=n!==t;});
  $$('.nav button').forEach(b=>{if(b.dataset.tab===t)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(t==='measures')drawChart();
  saveUi();if(push){try{history.replaceState(null,'','#'+t);}catch(e){}window.scrollTo(0,0);}
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.del){
    if(S.confirm===d.del){const p=d.del.split('/');S.confirm=null;removeDoc(p[0],p[1]).then(()=>toast('Запись удалена'),fail);renderData();}
    else{S.confirm=d.del;renderToday();renderTable();}
    return;
  }
  if(S.confirm){S.confirm=null;renderToday();renderTable();}
  if(d.tab){showTab(d.tab,true);return;}
  if(d.act==='mark'){S.formOpen=!S.formOpen;S.formDate=today();S.formW=null;renderToday();return;}
  if(d.act==='cancel'){S.formOpen=false;S.formW=null;renderToday();return;}
  if(d.act==='open'){S.w=d.w;renderWorkouts();showTab('workouts',true);return;}
  if(d.act==='expand'){S.expand=!S.expand;renderWorkouts();return;}
  if(d.act==='export'){exportData();return;}
  if(d.act==='import'){importData();return;}
  if(d.act==='done-today'){markWorkout(today(),d.w);return;}
  if(d.fw){S.formW=d.fw;const md=$('#mark-date');if(md)S.formDate=md.value;renderToday();return;}
  if(d.cal){let m=S.calM+Number(d.cal),y=S.calY;if(m<0){m=11;y--;}if(m>11){m=0;y++;}S.calM=m;S.calY=y;renderToday();return;}
  if(d.day){S.formOpen=true;S.formDate=d.day;renderToday();const f=$('#mark-form');if(f&&f.scrollIntoView)f.scrollIntoView({block:'center'});return;}
  if(d.w&&b.parentNode.id==='w-seg'){S.w=d.w;saveUi();renderWorkouts();window.scrollTo(0,0);return;}
  if(d.metric){S.metric=d.metric;saveUi();renderChips();drawChart();return;}
  if(d.edit){$('#m-date').value=d.edit;fillForm(d.edit);const f=$('#m-form');if(f.scrollIntoView)f.scrollIntoView({block:'start'});return;}
});
document.addEventListener('submit',ev=>{
  if(ev.target.id==='mark-form'){ev.preventDefault();const c=cycleInfo();markWorkout($('#mark-date').value,S.formW||c.next);}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='mark-date')S.formDate=ev.target.value;
  if(ev.target.id==='m-date')fillForm(ev.target.value);
});
$('#m-form').addEventListener('submit',submitMeasure);
let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.tab==='measures')drawChart();},150);});
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(TABS.indexOf(h)>=0&&h!==S.tab)showTab(h,false);});

$('#m-date').value=today();
renderWorkouts();renderPlan();renderChips();renderData();showTab(S.tab,false);
initStore();
if(STANDALONE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
</body></html>
